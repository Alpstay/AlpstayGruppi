<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlpStay · Gestione gruppi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>/* Stile "Console operativa" AlpStay: fondo caldo, schede bianche con bordo colorato, Barlow Semi Condensed + Inter.
   Oro = marchio e opzione scelta, verde = azione, blu e ardesia come nelle schede della Console. */
:root {
  --bg: #f5f3ee; --card: #ffffff; --ink: #16232a; --text: #1f2d34; --muted: #6b7b83; --line: #e5e0d6; --soft: #efece5;
  --gold: #b0883c; --gold-ink: #8a6a2c; --gold-soft: #f6efe1;
  --accent: #2e7d5b; --accent-ink: #25694b; --accent-soft: #e4f1ea; --on-accent: #ffffff;
  --blue: #3a5a78; --dark: #16232a;
  --ok: #2e7d5b; --ok-bg: #e4f1ea; --mid: #a8741a; --mid-bg: #faf0dc; --bad: #b23a2e; --bad-bg: #fbe9e6; --grey-bg: #eeece6;
  --scrim: rgba(22, 35, 42, 0.35); --r: 18px;
  --head: 'Barlow Semi Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111517; --card: #1a2125; --ink: #eef2f3; --text: #e2e8ea; --muted: #9aabb2; --line: #2b353b; --soft: #202a2f;
    --gold: #d4ac65; --gold-ink: #e0bd7c; --gold-soft: #2c2619;
    --accent: #6cc59b; --accent-ink: #7fd1a9; --accent-soft: #173026; --on-accent: #0c1612;
    --blue: #8fb0cf; --dark: #c9d3d8;
    --ok: #7fd1a9; --ok-bg: #173026; --mid: #e0b45a; --mid-bg: #3a2e14; --bad: #ef8279; --bad-bg: #3b1c19; --grey-bg: #232b2f;
    --scrim: rgba(0, 0, 0, 0.55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111517; --card: #1a2125; --ink: #eef2f3; --text: #e2e8ea; --muted: #9aabb2; --line: #2b353b; --soft: #202a2f;
  --gold: #d4ac65; --gold-ink: #e0bd7c; --gold-soft: #2c2619;
  --accent: #6cc59b; --accent-ink: #7fd1a9; --accent-soft: #173026; --on-accent: #0c1612;
  --blue: #8fb0cf; --dark: #c9d3d8;
  --ok: #7fd1a9; --ok-bg: #173026; --mid: #e0b45a; --mid-bg: #3a2e14; --bad: #ef8279; --bad-bg: #3b1c19; --grey-bg: #232b2f;
  --scrim: rgba(0, 0, 0, 0.55); color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--body); -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--head); font-weight: 700; margin: 0; color: var(--ink); }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
input[type="text"], input[type="search"], input[type="number"], input[type="email"], input[type="tel"], select, textarea {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-height: 42px; max-width: 100%; font-family: var(--body); color: var(--text);
}
select { border-radius: 999px; }
textarea { width: 100%; resize: vertical; line-height: 1.55; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted, .hint { color: var(--muted); }
.hint { font-size: 0.82rem; margin: 4px 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; vertical-align: 1px; }
.crumb, .side-h, .imports-label { font: 600 0.78rem var(--head); letter-spacing: 0.24em; text-transform: uppercase; }

/* testata */
.top { max-width: 1400px; margin: auto; padding: 26px 24px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: end; }
.eyebrow-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.logo { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 10px; background: linear-gradient(145deg, #b58d42, #d4ac65); color: #fff; font: 700 1.3rem var(--head); }
.crumb { margin: 0; color: var(--gold-ink); }
.brand h1 { font-size: clamp(2rem, 4.2vw, 3.1rem); line-height: 1.02; letter-spacing: -0.005em; }
.subtitle { margin: 10px 0 0; max-width: 720px; color: var(--muted); font-size: 1rem; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.imports { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.imports-label { color: var(--muted); font-size: 0.7rem; letter-spacing: 0.16em; }
.imports ul { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font: 600 0.9rem var(--head); color: var(--ink); }
.chip-when { color: var(--muted); font: 400 0.8rem var(--body); font-variant-numeric: tabular-nums; }
.chip.stale { border-color: var(--bad); color: var(--bad); }
.chip.stale .chip-when { color: var(--bad); }
.banners { grid-column: 1 / -1; display: grid; gap: 8px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line); border-left: 5px solid var(--gold); background: var(--card); }
.banner p { margin: 0; flex: 1 1 280px; }
.banner.warn { border-left-color: var(--mid); }
.banner.error { border-left-color: var(--bad); color: var(--bad); }

/* pulsanti */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); font: 600 1rem var(--head); letter-spacing: 0.01em; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.small { min-height: 34px; padding: 4px 14px; font-size: 0.92rem; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* menu laterale */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); max-width: 1400px; margin: auto; align-items: start; }
.side { position: sticky; top: 0; display: flex; flex-direction: column; gap: 3px; padding: 8px 12px 40px 24px; max-height: 100vh; overflow-y: auto; background: var(--bg); }
.side-h { margin: 16px 8px 6px; color: var(--muted); font-size: 0.68rem; letter-spacing: 0.2em; }
.side button { width: 100%; text-align: left; border: 1px solid transparent; border-radius: 12px; padding: 9px 12px; min-height: 42px; font: 600 1.02rem var(--head); color: var(--ink); background: none; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.side button:hover { background: var(--card); border-color: var(--line); }
.side button[aria-current="true"] { background: var(--dark); border-color: var(--dark); color: var(--bg); }
.count { margin-left: auto; min-width: 24px; padding: 0 8px; border-radius: 999px; background: var(--soft); color: var(--muted); font: 700 0.8rem/1.7 var(--head); text-align: center; }
.count.alert { background: var(--bad); color: #fff; }
.side button[aria-current="true"] .count { background: rgba(255, 255, 255, 0.18); color: inherit; }
.side button[aria-current="true"] .count.alert { background: var(--bad); color: #fff; }
.content { min-width: 0; }
.main { padding: 4px 24px 96px 12px; }
.menu-btn { display: none; margin: 0 16px 8px; }
.side-ov { display: none; }
@media (max-width: 900px) {
  .top { grid-template-columns: minmax(0, 1fr); padding: 20px 16px 12px; }
  .top-actions { justify-content: flex-start; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-flex; }
  .side { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 30; transform: translateX(-102%); transition: transform 0.2s; box-shadow: 0 0 40px rgba(0, 0, 0, 0.18); padding: calc(20px + env(safe-area-inset-top, 0px)) 14px 40px; }
  .side.open { transform: none; }
  .side-ov { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: 29; }
  .side-ov[hidden] { display: none; }
  .main { padding: 4px 14px 96px; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* titoli di sezione */
.todo-head h2, .page > h2, .settings h2 { font-size: 1.7rem; line-height: 1.1; margin: 14px 0 12px; }

/* schede con bordo colorato, come nella Console */
.kpi-tile, .todo-item, .step, .guide-card, .settings section, .welcome { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: var(--r); }
.k-gold { border-left-color: var(--gold) !important; }
.k-green { border-left-color: var(--accent) !important; }
.k-blue { border-left-color: var(--blue) !important; }
.k-dark { border-left-color: var(--dark) !important; }
.k-bad { border-left-color: var(--bad) !important; }
.k-mid { border-left-color: var(--mid) !important; }

/* da fare */
.todo:empty { display: none; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi-tile { display: grid; gap: 2px; padding: 14px 18px; text-align: left; font: inherit; color: inherit; }
.kpi-tile b { font: 700 2.3rem/1 var(--head); color: var(--ink); font-variant-numeric: tabular-nums; }
.kpi-tile span { font: 600 0.72rem var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.kpi-tile.k-bad.hot b { color: var(--bad); }
.kpi-tile.k-mid.hot b { color: var(--mid); }
.kpi-tile.k-blue.hot b { color: var(--blue); }
button.kpi-tile { cursor: pointer; }
button.kpi-tile:hover { background: var(--soft); }
.todo-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.todo-item { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 16px; border-left-color: var(--mid); }
.todo-item.s-overdue { border-left-color: var(--bad); }
.todo-when { font: 700 0.8rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--mid); }
.todo-item.s-overdue .todo-when { color: var(--bad); }
.todo-what { display: flex; flex-direction: column; min-width: 0; }
.todo-what strong { font: 700 1.2rem/1.2 var(--head); color: var(--ink); }
.todo-what > span { color: var(--muted); font-size: 0.88rem; }
.todo-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
@media (max-width: 760px) {
  .todo-item { grid-template-columns: minmax(0, 1fr); }
  .todo-actions { justify-content: flex-start; }
}

/* filtri e scelte (opzione scelta in oro, come la lingua nella Console) */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 20px 0 12px; }
.toolbar:empty { display: none; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.seg button { border: 0; border-radius: 9px; background: none; padding: 6px 12px; min-height: 34px; cursor: pointer; font: 700 0.92rem var(--head); letter-spacing: 0.04em; color: var(--muted); }
.seg button.on { background: var(--gold); color: #fff; }
.seg button:disabled { opacity: 0.45; cursor: not-allowed; }
.search { flex: 1 1 240px; border-radius: 999px !important; }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.9rem; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.sort { font-size: 0.88rem; color: var(--muted); }
.sort select { margin-left: 4px; }

/* tableau */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th, td { text-align: left; vertical-align: top; }
.tableau { min-width: 1200px; }
.tableau thead th { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 8px; z-index: 2; font-weight: 400; vertical-align: bottom; }
.tableau thead th.c-group, .tableau thead th.c-stay { font: 600 0.72rem var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.tableau thead th.c-group { z-index: 3; }
.tableau .lead { display: block; font: 700 1.6rem/1 var(--head); color: var(--gold-ink); font-variant-numeric: tabular-nums; }
.tableau .cap { display: block; margin-top: 4px; font: 700 1rem/1.1 var(--head); color: var(--ink); }
.tableau .sub { display: block; color: var(--muted); font-size: 0.72rem; }
.tableau tbody th, .tableau tbody td { border-bottom: 1px solid var(--line); padding: 6px 8px; }
.tableau tbody tr:last-child th, .tableau tbody tr:last-child td { border-bottom: 0; }
.tableau .c-group { position: sticky; left: 0; background: var(--card); min-width: 240px; max-width: 290px; z-index: 1; padding-left: 18px; }
.prop-bar { position: absolute; left: 0; top: 8px; bottom: 8px; width: 5px; border-radius: 0 4px 4px 0; }
.group-name { display: block; border: 0; background: none; padding: 0; font: 700 1.1rem/1.2 var(--head); text-align: left; cursor: pointer; color: var(--ink); }
.group-name:hover { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }
.group-meta { display: block; color: var(--muted); font-size: 0.8rem; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.badge { padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font: 700 0.74rem/1.6 var(--head); letter-spacing: 0.04em; white-space: nowrap; }
.badge.gold { border-color: var(--gold); color: var(--gold-ink); background: var(--gold-soft); }
.badge.red { border-color: var(--bad); color: var(--bad); }
.badge.amber { border-color: var(--mid); color: var(--mid); }
.c-stay { min-width: 150px; }
.stay-dates { display: block; font: 700 1rem var(--head); color: var(--ink); font-variant-numeric: tabular-nums; }
.stay-sub { display: block; color: var(--muted); font-size: 0.8rem; }
.tableau tr.excluded { opacity: 0.55; }
.c-step { min-width: 118px; }
.cell { width: 100%; min-height: 42px; border: 0; border-radius: 12px; padding: 8px 10px; text-align: left; background: transparent; cursor: pointer; font: 600 0.95rem var(--head); font-variant-numeric: tabular-nums; }
.cell.s-done { background: var(--ok-bg); color: var(--ok); }
.cell.s-overdue { background: var(--bad-bg); color: var(--bad); font-weight: 700; }
.cell.s-today { background: var(--mid-bg); color: var(--mid); font-weight: 700; }
.cell.s-soon { background: var(--mid-bg); color: var(--mid); }
.cell.s-planned { color: var(--ink); }
.cell.s-waiting, .cell.s-na, .cell.s-lapsed { color: var(--muted); font-weight: 500; }
.cell.s-lapsed { background: var(--grey-bg); }
.cell:hover { box-shadow: inset 0 0 0 1px var(--line); }
.cell-sub { display: block; font: 500 0.78rem var(--body); opacity: 0.85; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); }
.welcome { max-width: 680px; margin: 24px auto; padding: 28px; color: var(--ink); border-left-color: var(--gold); }
.welcome h2 { font-size: 1.6rem; margin-bottom: 8px; }
.welcome p { color: var(--muted); }
.welcome .row { justify-content: center; }

/* planning */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 8px; font: 600 0.72rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.plan-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); max-height: 72vh; background: var(--card); }
.plan { position: relative; }
.phead { display: flex; position: sticky; top: 0; z-index: 4; background: var(--card); border-bottom: 1px solid var(--line); }
.pcorner { position: sticky; left: 0; z-index: 5; background: var(--card); padding: 8px 12px; flex: none; font: 600 0.72rem var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.pscale { position: relative; flex: none; }
.pmonths, .pdays { position: relative; height: 24px; }
.pm { position: absolute; top: 0; height: 24px; padding: 0 8px; font: 700 0.9rem/24px var(--head); color: var(--gold-ink); border-left: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
.pd { position: absolute; top: 0; height: 24px; text-align: center; font: 600 0.78rem/24px var(--head); color: var(--muted); font-variant-numeric: tabular-nums; }
.pd.we { background: var(--soft); }
.pd.td { color: var(--ink); font-weight: 700; }
.prow { display: flex; height: 48px; border-bottom: 1px solid var(--line); }
.plabel { position: sticky; left: 0; z-index: 3; background: var(--card); display: flex; align-items: center; gap: 6px; padding: 0 10px; flex: none; min-width: 0; border-right: 1px solid var(--line); }
.plink { border: 0; background: none; padding: 0; font: 700 1rem var(--head); color: var(--ink); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; text-align: left; }
.psub { color: var(--muted); font-size: 0.74rem; white-space: nowrap; }
.plane { position: relative; flex: none; }
.pbar { position: absolute; top: 12px; height: 24px; border: 0; border-radius: 8px; color: #fff; font: 700 0.8rem var(--head); cursor: pointer; overflow: hidden; white-space: nowrap; padding: 0 8px; text-align: left; }
.pmk { position: absolute; top: 17px; width: 14px; height: 14px; transform: rotate(45deg); border: 2px solid var(--card); padding: 0; cursor: pointer; z-index: 1; }
.pmk.static { position: static; display: inline-block; cursor: default; }
.pmk.s-overdue { background: var(--bad); }
.pmk.s-today { background: var(--mid); }
.pmk.s-soon { background: #d9a53a; }
.pmk.s-planned { background: var(--muted); }
.ptoday { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--gold); pointer-events: none; z-index: 2; }
.ptoday-key { display: inline-block; width: 2px; height: 14px; background: var(--gold); }

/* scheda laterale */
.panel-host .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100%); background: var(--bg); z-index: 21; display: flex; flex-direction: column; border-left: 1px solid var(--line); box-shadow: -20px 0 40px rgba(22, 35, 42, 0.14); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 22px 14px; border-bottom: 1px solid var(--line); background: var(--card); }
.sheet-head h2 { font-size: 1.7rem; line-height: 1.1; }
.sheet-sub { margin: 4px 0 0; font: 600 0.74rem var(--head); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-ink); }
.sheet-body { flex: 1; overflow-y: auto; padding: 16px 22px 24px; }
.sheet-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; padding: 12px 22px; border-top: 1px solid var(--line); background: var(--card); }
.facts { display: grid; grid-template-columns: 136px 1fr; gap: 6px 12px; margin: 0 0 12px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); font-size: 0.9rem; }
.facts dt { font: 600 0.7rem/1.9 var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; }
.organizer, .controls { display: grid; gap: 8px; margin: 0 0 12px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.organizer { border-left: 5px solid var(--blue); }
.organizer h3, .sub-title, .tpl-preview h3 { font: 700 1.15rem var(--head); color: var(--ink); }
.sub-title { margin: 16px 0 8px; }
.org-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.org-grid label { display: grid; gap: 4px; font: 600 0.7rem var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.org-grid input { width: 100%; color: var(--text); font: 400 0.92rem var(--body); letter-spacing: 0; text-transform: none; }
.org-grid input.edited { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--gold); }
@media (max-width: 480px) { .org-grid { grid-template-columns: 1fr; } }
.lang { display: flex; align-items: center; gap: 10px; font-size: 0.88rem; color: var(--muted); }
.pay { display: grid; gap: 6px; margin: 8px 0 4px; }
.pay-label { font-size: 0.84rem; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 14px 16px; }
.step.s-overdue { border-left-color: var(--bad); }
.step.s-today, .step.s-soon { border-left-color: var(--mid); }
.step.s-done { border-left-color: var(--ok); }
.step.focus { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
.step-n { font: 700 1.6rem/1 var(--head); color: var(--gold-ink); font-variant-numeric: tabular-nums; }
.step h3 { font-size: 1.2rem; line-height: 1.2; }
.step-when { margin: 3px 0 6px; font: 700 0.78rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; }
.step.s-overdue .step-when { color: var(--bad); }
.step.s-today .step-when, .step.s-soon .step-when { color: var(--mid); }
.step.s-done .step-when { color: var(--ok); }
.step.s-na .step-when, .step.s-waiting .step-when, .step.s-lapsed .step-when, .step.s-planned .step-when { color: var(--muted); }
.step-info { margin: 4px 0; color: var(--muted); font-size: 0.88rem; }
.step-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.notes { display: grid; gap: 4px; margin: 16px 0; }
.notes > span { font: 600 0.7rem var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.table-wrap.small table { min-width: 560px; font-size: 0.82rem; }
.bookings th { font: 600 0.7rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.bookings th, .bookings td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
.bookings tr:last-child td { border-bottom: 0; }
.bookings tr.cancelled td { color: var(--muted); text-decoration: line-through; }
.mono-id { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* import */
.file { margin: 0 0 12px; }
.field { border: 0; padding: 0; margin: 0 0 12px; }
.field legend { margin-bottom: 6px; font: 600 0.72rem var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.summary { margin: 12px 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 10px; }
.kpi { display: grid; gap: 2px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--gold); border-radius: 14px; }
.kpi-n { font: 700 2rem/1 var(--head); color: var(--ink); font-variant-numeric: tabular-nums; }
.kpi-l { font: 600 0.7rem var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.new-list, .near-list { margin: 0 0 8px; padding-left: 18px; font-size: 0.9rem; }
.near-list { list-style: none; padding-left: 0; }
.new-list li, .near-list li { margin: 4px 0; }
.mapping { margin-top: 16px; padding: 10px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.mapping summary { cursor: pointer; min-height: 34px; font: 700 1.05rem/34px var(--head); color: var(--ink); }
.mapping table th { padding: 4px 8px 4px 0; font-weight: 400; color: var(--muted); font-size: 0.86rem; }
.mapping select { width: 100%; }
.sheet-body .banner { margin: 8px 0; }

/* pagine */
.page { margin-top: 4px; }
.page > .crumb { margin: 16px 0 0; }
.page > .crumb + h2 { margin-top: 4px; }
.lead-text { color: var(--muted); max-width: 820px; font-size: 1rem; }
.reg-add { display: grid; grid-template-columns: 1fr 1fr 1.4fr auto; gap: 8px; margin: 16px 0; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--gold); border-radius: var(--r); }
.regulars th { font: 600 0.7rem var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.regulars th, .regulars td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
.regulars tr:last-child td { border-bottom: 0; }
.regulars input { width: 100%; }
@media (max-width: 760px) { .reg-add { grid-template-columns: 1fr; } }
.texts { display: grid; grid-template-columns: 260px minmax(0, 1fr) minmax(0, 0.9fr); gap: 20px; align-items: start; }
.tpl-nav { display: grid; gap: 8px; }
.tpl-item { text-align: left; border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 14px; background: var(--card); padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; justify-items: start; font: 700 1.02rem/1.2 var(--head); color: var(--ink); }
.tpl-item.on { border-left-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
.tpl-edit { display: grid; gap: 10px; }
.field-col { display: grid; gap: 4px; }
.field-col > span { font: 600 0.7rem var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line); border-radius: 999px; background: var(--card); padding: 3px 10px; font: 400 0.76rem var(--body); cursor: pointer; }
.chip-btn:hover { border-color: var(--gold); color: var(--gold-ink); }
.preview { white-space: pre-wrap; margin: 8px 0 0; padding: 16px; max-height: 70vh; overflow: auto; font: 0.9rem/1.6 var(--body); background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
@media (max-width: 1100px) { .texts { grid-template-columns: minmax(0, 1fr); } }
.settings section { display: grid; gap: 10px; max-width: 900px; margin: 0 0 12px; padding: 16px 18px; border-left-color: var(--gold); }
.settings h2 { font-size: 1.4rem; margin: 0 0 4px; }
.settings h3 { font-size: 1.05rem; }
.field-group { display: grid; gap: 6px; }
.field-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.92rem; }
.field-label { min-width: 250px; }
.field-row input[type="number"] { width: 96px; }
.suffix { color: var(--muted); font-size: 0.88rem; }

/* come funziona */
.guide-grid { display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-flow: dense; gap: 14px; margin-top: 16px; }
@media (min-width: 760px) { .guide-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1280px) { .guide-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.guide-card { padding: 18px 20px; display: grid; gap: 8px; align-content: start; }
.guide-card.wide { grid-column: 1 / -1; }
.guide-icon { font-size: 2rem; line-height: 1; }
.guide-card h3 { font-size: 1.45rem; line-height: 1.1; }
.guide-card p { margin: 0; color: var(--text); }
.guide-list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.guide-list.swatches { list-style: none; padding-left: 0; }
.guide-steps { list-style: none; margin: 4px 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px 20px; }
.guide-steps li { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: start; }
.gs-n { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--gold-soft); color: var(--gold-ink); font: 700 1.1rem var(--head); }
.gs-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.gs-head strong { font: 700 1.1rem var(--head); color: var(--ink); }
.gs-when { font: 600 0.72rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-ink); }
.guide-steps p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
.sw { display: inline-block; min-width: 92px; padding: 3px 10px; border-radius: 10px; font: 700 0.92rem var(--head); text-align: center; }
.sw.s-overdue { background: var(--bad-bg); color: var(--bad); }
.sw.s-today { background: var(--mid-bg); color: var(--mid); }
.sw.s-done { background: var(--ok-bg); color: var(--ok); }
.sw.s-waiting { background: var(--grey-bg); color: var(--muted); }

/* notifiche e trascinamento */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: grid; gap: 8px; width: min(560px, calc(100% - 24px)); }
.toast { display: grid; gap: 8px; padding: 12px 16px; border-radius: 14px; background: var(--dark); color: var(--bg); font-size: 0.92rem; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
.toast p { margin: 0; }
.toast.error { background: var(--bad); color: #fff; }
.toast .btn { border-color: currentColor; background: transparent; color: inherit; }
.toast-actions { display: flex; gap: 6px; justify-content: flex-end; }
.copybox { background: var(--card); color: var(--text); }
.drop { position: fixed; inset: 12px; z-index: 50; display: none; align-items: center; justify-content: center; border: 3px dashed var(--gold); border-radius: var(--r); background: color-mix(in srgb, var(--bg) 88%, transparent); font: 700 1.8rem var(--head); color: var(--gold-ink); pointer-events: none; }
.drop.on { display: flex; }

/* telefono: testata più compatta, così "Da fare" resta a portata di pollice */
@media (max-width: 600px) {
  .subtitle { display: none; }
  .eyebrow-row { margin-bottom: 8px; }
  .logo { width: 34px; height: 34px; font-size: 1.1rem; }
  .brand h1 { font-size: 1.9rem; }
  .imports ul { gap: 4px; }
  .chip { padding: 2px 10px; font-size: 0.85rem; }
}

/* accesso e account (versione GitHub Pages + Firebase) */
input[type="password"] { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-height: 42px; max-width: 100%; font-family: var(--body); color: var(--text); }
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.login-card { width: min(440px, 100%); display: grid; gap: 12px; padding: 28px; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--gold); border-radius: var(--r); }
.login-card .eyebrow-row { margin-bottom: 4px; }
.login-card h1 { font-size: 2.2rem; line-height: 1.05; }
.login-card .muted { margin: 0; }
.login-form { display: grid; gap: 12px; margin-top: 6px; }
.login-form label { display: grid; gap: 4px; font: 600 0.7rem var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.login-form input { width: 100%; font: 400 0.95rem var(--body); letter-spacing: 0; text-transform: none; color: var(--text); }
.login-msg { min-height: 1.4em; margin: 0; color: var(--bad); font-size: 0.88rem; }
.login-msg.ok { color: var(--accent-ink); }
.account { margin-top: 18px; padding-top: 6px; border-top: 1px solid var(--line); display: grid; gap: 6px; justify-items: start; }
.account .side-h { margin: 10px 8px 0; }
.account-name { margin: 0 8px; font-size: 0.86rem; color: var(--text); word-break: break-word; }
.account .btn { margin-left: 8px; }
</style>

siamo lieti di accogliervi presso la nostra struttura per il vostro soggiorno {{stagione}}.

Desideriamo ricordarvi che, come specificato sul nostro sito web ufficiale e sui canali di prenotazione, le prenotazioni di gruppo (definite come un numero pari o superiore a {{soglia_camere}} camere, o prenotazioni multiple effettuate a nome del medesimo prenotante) prevedono condizioni specifiche volte a garantire la massima qualità del servizio per tutti i nostri ospiti.

Per poter confermare e bloccare in via definitiva le camere prenotate, verrà richiesto 2 mesi prima della data d’arrivo, il versamento di una caparra pari al 30% del valore totale del soggiorno. Sarà nostra cura scrivervi in quel periodo per fornirvi tutti i dettagli necessari. Questa caparra funge da garanzia reciproca: permette a voi di avere la certezza della disponibilità e alla nostra struttura di riservare le risorse necessarie con la dovuta accuratezza.

Nota bene: il versamento è inteso come caparra confirmatoria non rimborsabile, a tutela del blocco delle camere e della pianificazione operativa.

Per organizzarci al meglio, vi chiediamo di indicarci fin d’ora con quale mezzo preferite versare la caparra: bonifico bancario, link di pagamento (Zahlknopf) o addebito sulla carta di credito indicata nella prenotazione.

Ecco come funzionerà il resto:

- Flessibilità: fino a 5 giorni prima del vostro arrivo, potrete richiedere modifiche alla prenotazione. Se ci sarà disponibilità, aggiorneremo la prenotazione adattando il prezzo alle nuove esigenze.

- Cancellazione: sempre entro il limite dei 5 giorni dall’arrivo, è possibile cancellare la prenotazione senza ulteriori penali (oltre alla caparra versata).

- Il saldo: il pagamento della parte restante verrà richiesto 5 giorni prima del vostro arrivo, come da prassi per le nostre prenotazioni.

Restiamo a vostra completa disposizione per qualsiasi chiarimento o necessità. Non vediamo l'ora di darvi il benvenuto.

Un cordiale saluto,

Il team degli Alpstay Hotels`,Ry=`Dear Guests,

We are delighted to welcome you to our hotel for your upcoming {{stagione}} stay.

We would like to remind you that, as specified on our official website and booking channels, group bookings (defined as {{soglia_camere}} or more rooms, or multiple bookings made under the same name) are subject to specific conditions to ensure the highest quality of service for all our guests.

To confirm and definitively secure the booked rooms, a deposit of 30% of the total stay value will be required 2 months prior to your arrival date. We will contact you at that time to provide you with all the necessary payment details. This deposit serves as a mutual guarantee: it ensures your room availability and allows our staff to carefully manage the necessary resources. Please note: This deposit is non-refundable, as it secures the reservation of the rooms and assists in our operational planning.

So that we can organise everything in advance, please let us know now how you would prefer to pay the deposit: bank transfer, payment link or charge to the credit card provided with your booking.

Here is how the rest of the process works:

- Flexibility: You may request changes to your booking up to 5 days before your arrival. Subject to availability, we will be happy to update your booking and adjust the price to your new requirements.

- Cancellation: You may cancel your reservation up to 5 days before your arrival without any further penalty (beyond the deposit paid).

- Balance: The remaining balance will be requested 5 days before your arrival, in accordance with our standard booking conditions.

We remain at your complete disposal for any questions or needs. We look forward to welcoming you.

Kind regards,

The Alpstay Hotels Team`,Ny=`Sehr geehrte Gäste,

wir freuen uns sehr, Sie diesen {{stagione}} in unserem Haus begrüßen zu dürfen.

Wir möchten Sie daran erinnern, dass für Gruppenbuchungen (definiert als {{soglia_camere}} oder mehr Zimmer oder mehrere Buchungen, die auf denselben Namen getätigt wurden), wie auf unserer offiziellen Website und in den Buchungsportalen angegeben, besondere Bedingungen gelten. Diese dienen dazu, die höchste Servicequalität für alle unsere Gäste zu gewährleisten.

Um die gebuchten Zimmer endgültig zu bestätigen und für Sie zu sichern, wird 2 Monate vor Anreise eine Anzahlung in Höhe von 30 % des Gesamtaufenthaltswertes fällig. Wir werden uns zu diesem Zeitpunkt bei Ihnen melden, um Ihnen alle erforderlichen Details zur Zahlung mitzuteilen. Diese Anzahlung dient als gegenseitige Sicherheit: Sie garantiert Ihnen die Verfügbarkeit der Zimmer und ermöglicht es unserem Team, die notwendigen Ressourcen sorgfältig zu planen. Bitte beachten Sie: Diese Anzahlung ist nicht erstattungsfähig, da sie der verbindlichen Zimmerreservierung und der betrieblichen Planung dient.

Damit wir alles bestmöglich vorbereiten können, bitten wir Sie, uns bereits jetzt mitzuteilen, wie Sie die Anzahlung leisten möchten: per Banküberweisung, über einen Zahlungslink (Zahlknopf) oder durch Belastung der bei der Buchung angegebenen Kreditkarte.

So funktioniert der weitere Ablauf:

- Flexibilität: Bis 5 Tage vor Anreise können Sie Änderungen an Ihrer Buchung vornehmen. Sofern verfügbar, werden wir Ihre Buchung gerne aktualisieren und den Preis an Ihre neuen Anforderungen anpassen.

- Stornierung: Bis zu 5 Tage vor Anreise können Sie Ihre Buchung ohne weitere Gebühren stornieren (abgesehen von der bereits geleisteten Anzahlung).

- Restzahlung: Die Restzahlung des Gesamtbetrages wird 5 Tage vor Anreise fällig, gemäß unseren üblichen Buchungsbedingungen.

Für Rückfragen oder weitere Informationen stehen wir Ihnen jederzeit gerne zur Verfügung. Wir freuen uns darauf, Sie bald bei uns willkommen zu heißen.

Mit freundlichen Grüßen,

Ihr Alpstay Hotels Team`,Py=`Buongiorno,

siamo lieti di vedervi tra pochi mesi!

Come comunicato, essendo il vostro arrivo previsto a 2 mesi da domani, la struttura procederà con la richiesta di pagamento della caparra richiesta.

Se si desidera procedere con il pagamento della caparra del 30% tramite bonifico o link di pagamento, vi chiederemmo di comunicarcelo entro le prossime 24h rispondendo a questo messaggio.

Senza una comunicazione particolare verrà effettuata in automatico una detrazione pari al 30% del soggiorno totale dalla carta di credito fornita.

Non dovesse essere possibile la detrazione le camere prenotate non saranno garantite e saranno rimesse in vendita fino a pagamento effettuato della caparra.

Un cordiale saluto,

Il team degli Alpstay Hotels`,Dy=`Good morning,

we look forward to seeing you in a few months!

As previously communicated, since your arrival is scheduled for two months from tomorrow, the property will proceed with the request for payment of the required deposit.

If you wish to pay the 30% deposit by bank transfer or payment link, please let us know within the next 24 hours by replying to this message.

Without specific notification, a deduction equal to 30% of the total stay will be automatically made from the credit card provided.

If the deduction is not possible, the rooms booked will not be guaranteed and will be put back on sale until the deposit is paid.

Kind regards,

The team of Alpstay Hotels`,Oy=`Guten Tag,

wir freuen uns, Sie in wenigen Monaten begrüßen zu dürfen!

Wie bereits mitgeteilt, wird die Unterkunft, da Ihre Ankunft in zwei Monaten ab Morgen vorgesehen ist, die Zahlung der erforderlichen Anzahlung beantragen.
