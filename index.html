<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlpStay · Gestione gruppi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>/* Stile "Console operativa" AlpStay, versione compatta: barra in alto fissa, righe dense, schede con bordo colorato.
   Oro = marchio e opzione scelta, verde = azione, ardesia = scheda attiva. */
:root {
  --bg: #f5f3ee; --card: #ffffff; --ink: #16232a; --text: #1f2d34; --muted: #6b7b83; --line: #e5e0d6; --soft: #efece5;
  --gold: #b0883c; --gold-ink: #8a6a2c; --gold-soft: #f6efe1;
  --accent: #2e7d5b; --accent-ink: #25694b; --accent-soft: #e4f1ea; --on-accent: #ffffff;
  --blue: #3a5a78; --dark: #16232a;
  --ok: #2e7d5b; --ok-bg: #e4f1ea; --mid: #a8741a; --mid-bg: #faf0dc; --bad: #b23a2e; --bad-bg: #fbe9e6; --grey-bg: #eeece6;
  --scrim: rgba(22, 35, 42, 0.35); --r: 12px;
  --head: 'Barlow Semi Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111517; --card: #1a2125; --ink: #eef2f3; --text: #e2e8ea; --muted: #9aabb2; --line: #2b353b; --soft: #202a2f;
    --gold: #d4ac65; --gold-ink: #e0bd7c; --gold-soft: #2c2619;
    --accent: #6cc59b; --accent-ink: #7fd1a9; --accent-soft: #173026; --on-accent: #0c1612;
    --blue: #8fb0cf; --dark: #c9d3d8;
    --ok: #7fd1a9; --ok-bg: #173026; --mid: #e0b45a; --mid-bg: #3a2e14; --bad: #ef8279; --bad-bg: #3b1c19; --grey-bg: #232b2f;
    --scrim: rgba(0, 0, 0, 0.55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111517; --card: #1a2125; --ink: #eef2f3; --text: #e2e8ea; --muted: #9aabb2; --line: #2b353b; --soft: #202a2f;
  --gold: #d4ac65; --gold-ink: #e0bd7c; --gold-soft: #2c2619;
  --accent: #6cc59b; --accent-ink: #7fd1a9; --accent-soft: #173026; --on-accent: #0c1612;
  --blue: #8fb0cf; --dark: #c9d3d8;
  --ok: #7fd1a9; --ok-bg: #173026; --mid: #e0b45a; --mid-bg: #3a2e14; --bad: #ef8279; --bad-bg: #3b1c19; --grey-bg: #232b2f;
  --scrim: rgba(0, 0, 0, 0.55); color-scheme: dark;
}
html { scroll-padding-top: 64px; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--body); -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--head); font-weight: 700; margin: 0; color: var(--ink); line-height: 1.15; }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
input[type="text"], input[type="search"], input[type="number"], input[type="email"], input[type="tel"], input[type="password"], select, textarea {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-height: 36px; max-width: 100%; font-family: var(--body); color: var(--text);
}
select { border-radius: 999px; }
textarea { width: 100%; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted, .hint { color: var(--muted); }
.hint { font-size: 0.8rem; margin: 2px 0; }
.note { margin: 6px 0; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; vertical-align: 1px; }
.logo { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 8px; background: linear-gradient(145deg, #b58d42, #d4ac65); color: #fff; font: 700 1rem var(--head); }
.crumb { margin: 0; font: 600 0.72rem var(--head); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-ink); }

/* barra in alto: marchio, schede, azioni (sempre visibile) */
.topbar { position: sticky; top: 0; z-index: 15; display: flex; align-items: center; gap: 8px 18px; padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px; background: var(--card); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand-name { font: 700 1.15rem var(--head); color: var(--ink); white-space: nowrap; }
.topnav { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; border-radius: 8px; padding: 6px 12px; min-height: 34px; font: 600 0.98rem var(--head); color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab:hover { background: var(--soft); color: var(--ink); }
.tab[aria-current="page"] { background: var(--dark); color: var(--bg); }
.count { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #fff; font: 700 0.75rem/1.6 var(--head); text-align: center; }
.top-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.account { display: inline-flex; align-items: center; gap: 2px; margin-left: 6px; padding-left: 10px; border-left: 1px solid var(--line); font-size: 0.82rem; color: var(--muted); }
.account-name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* riga di stato: ultimi import e avvisi */
.status { max-width: 1440px; margin: 0 auto; padding: 8px 16px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.imports { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.imports-label { font: 600 0.68rem var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.imports ul { display: flex; flex-wrap: wrap; gap: 4px; list-style: none; margin: 0; padding: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font: 600 0.84rem var(--head); color: var(--ink); }
.chip-when { color: var(--muted); font: 400 0.76rem var(--body); font-variant-numeric: tabular-nums; }
.chip.stale { border-color: var(--bad); color: var(--bad); }
.chip.stale .chip-when { color: var(--bad); }
.banners { flex-basis: 100%; display: grid; gap: 6px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); border-left: 4px solid var(--gold); background: var(--card); font-size: 0.86rem; }
.banner p { margin: 0; flex: 1 1 260px; }
.banner.warn { border-left-color: var(--mid); }
.banner.error { border-left-color: var(--bad); color: var(--bad); }
.banner .btn { min-height: 30px; padding: 3px 12px; font-size: 0.88rem; }

/* pulsanti */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 36px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); font: 600 0.95rem var(--head); letter-spacing: 0.01em; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--soft); }
.btn.small { min-height: 32px; padding: 4px 11px; font-size: 0.9rem; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.main { max-width: 1440px; margin: 0 auto; padding: 4px 16px 72px; }

/* da fare */
.todo:empty { display: none; }
.todo-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 12px 0 8px; }
.todo-head h2 { font-size: 1.35rem; }
.fchips { display: flex; flex-wrap: wrap; gap: 5px; }
.fchip { display: inline-flex; align-items: baseline; gap: 4px; padding: 3px 10px; min-height: 30px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font: 600 0.88rem var(--head); color: var(--muted); cursor: pointer; }
.fchip b { font-size: 1rem; color: var(--ink); }
.fchip.bad b { color: var(--bad); }
.fchip.mid b { color: var(--mid); }
.fchip.blue { border-color: var(--blue); }
.fchip.blue b { color: var(--blue); }
.fchip.on { background: var(--dark); border-color: var(--dark); color: var(--bg); }
.fchip.on b { color: inherit; }
.todo-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.todo-item { display: grid; grid-template-columns: 128px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 5px 8px 5px 10px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--mid); border-radius: 10px; }
.todo-item.s-overdue { border-left-color: var(--bad); }
.todo-when { font: 700 0.78rem var(--head); letter-spacing: 0.03em; text-transform: uppercase; color: var(--mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.todo-item.s-overdue .todo-when { color: var(--bad); }
.todo-what { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; min-width: 0; padding: 2px 0; border: 0; background: none; text-align: left; cursor: pointer; color: inherit; }
.todo-what strong { font: 700 1rem var(--head); color: var(--ink); }
.todo-what > span { color: var(--muted); font-size: 0.82rem; }
.todo-what:hover strong { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }
.todo-actions { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }

/* filtri */
.toolbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 14px 0 8px; }
.toolbar:empty { display: none; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.seg button { border: 0; border-radius: 8px; background: none; padding: 3px 10px; min-height: 28px; cursor: pointer; font: 700 0.88rem var(--head); color: var(--muted); }
.seg button.on { background: var(--gold); color: #fff; }
.seg button:disabled { opacity: 0.45; cursor: not-allowed; }
.search { flex: 1 1 220px; max-width: 360px; border-radius: 999px !important; min-height: 34px !important; }
.check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 0.85rem; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.sort { font-size: 0.85rem; color: var(--muted); }
.sort select { margin-left: 4px; min-height: 32px; padding: 3px 10px; }

/* tableau */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th, td { text-align: left; vertical-align: middle; }
.tableau { min-width: 1060px; }
.tableau thead th { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line); padding: 6px 6px; z-index: 2; font-weight: 400; vertical-align: bottom; }
.tableau thead th.c-group, .tableau thead th.c-stay { font: 600 0.68rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.tableau thead th.c-group { z-index: 3; }
.tableau .lead { display: block; font: 700 1.05rem/1 var(--head); color: var(--gold-ink); font-variant-numeric: tabular-nums; }
.tableau .cap { display: block; margin-top: 2px; font: 700 0.84rem/1.1 var(--head); color: var(--ink); }
.tableau tbody th, .tableau tbody td { border-bottom: 1px solid var(--line); padding: 3px 5px; }
.tableau tbody tr:last-child th, .tableau tbody tr:last-child td { border-bottom: 0; }
.tableau tbody tr:hover td, .tableau tbody tr:hover th { background: var(--soft); }
.tableau .c-group { position: sticky; left: 0; background: var(--card); min-width: 210px; max-width: 250px; z-index: 1; padding-left: 12px; }
.prop-bar { position: absolute; left: 0; top: 5px; bottom: 5px; width: 4px; border-radius: 0 3px 3px 0; }
.group-name { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: none; padding: 0; font: 700 0.98rem/1.2 var(--head); text-align: left; cursor: pointer; color: var(--ink); }
.group-name:hover { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }
.group-meta { display: block; color: var(--muted); font-size: 0.74rem; }
.badges { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.badges:empty { display: none; }
.badge { padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font: 700 0.7rem/1.5 var(--head); letter-spacing: 0.03em; white-space: nowrap; }
.badge.gold { border-color: var(--gold); color: var(--gold-ink); background: var(--gold-soft); }
.badge.red { border-color: var(--bad); color: var(--bad); }
.badge.amber { border-color: var(--mid); color: var(--mid); }
.c-stay { min-width: 118px; }
.stay-dates { display: block; font: 700 0.92rem var(--head); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stay-sub { display: block; color: var(--muted); font-size: 0.74rem; white-space: nowrap; }
.tableau tr.excluded { opacity: 0.55; }
.c-step { min-width: 96px; }
.cell { width: 100%; min-height: 30px; border: 0; border-radius: 8px; padding: 4px 8px; text-align: left; background: transparent; cursor: pointer; font: 600 0.86rem/1.2 var(--head); font-variant-numeric: tabular-nums; }
.cell.s-done { background: var(--ok-bg); color: var(--ok); }
.cell.s-overdue { background: var(--bad-bg); color: var(--bad); font-weight: 700; }
.cell.s-today { background: var(--mid-bg); color: var(--mid); font-weight: 700; }
.cell.s-soon { background: var(--mid-bg); color: var(--mid); }
.cell.s-planned { color: var(--ink); }
.cell.s-waiting, .cell.s-na, .cell.s-lapsed { color: var(--muted); font-weight: 500; }
.cell.s-lapsed { background: var(--grey-bg); }
.cell:hover { box-shadow: inset 0 0 0 1px var(--muted); }
.cell-sub { display: block; font: 500 0.72rem var(--body); opacity: 0.85; }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }
.welcome { max-width: 620px; margin: 20px auto; padding: 22px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: var(--r); }
.welcome h2 { font-size: 1.4rem; margin-bottom: 6px; }
.welcome p { color: var(--muted); }
.welcome .row { justify-content: center; }

/* planning */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 6px; font: 600 0.7rem var(--head); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.lg { display: inline-flex; align-items: center; gap: 5px; }
.plan-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); max-height: 70vh; background: var(--card); }
.plan { position: relative; }
.phead { display: flex; position: sticky; top: 0; z-index: 4; background: var(--card); border-bottom: 1px solid var(--line); }
.pcorner { position: sticky; left: 0; z-index: 5; background: var(--card); padding: 6px 10px; flex: none; font: 600 0.68rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.pscale { position: relative; flex: none; }
.pmonths, .pdays { position: relative; height: 22px; }
.pm { position: absolute; top: 0; height: 22px; padding: 0 6px; font: 700 0.84rem/22px var(--head); color: var(--gold-ink); border-left: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
.pd { position: absolute; top: 0; height: 22px; text-align: center; font: 600 0.74rem/22px var(--head); color: var(--muted); font-variant-numeric: tabular-nums; }
.pd.we { background: var(--soft); }
.pd.td { color: var(--ink); font-weight: 700; }
.prow { display: flex; height: 38px; border-bottom: 1px solid var(--line); }
.plabel { position: sticky; left: 0; z-index: 3; background: var(--card); display: flex; align-items: center; gap: 6px; padding: 0 8px; flex: none; min-width: 0; border-right: 1px solid var(--line); }
.plink { border: 0; background: none; padding: 0; font: 700 0.92rem var(--head); color: var(--ink); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; text-align: left; }
.psub { color: var(--muted); font-size: 0.72rem; white-space: nowrap; }
.plane { position: relative; flex: none; }
.pbar { position: absolute; top: 8px; height: 22px; border: 0; border-radius: 6px; color: #fff; font: 700 0.76rem var(--head); cursor: pointer; overflow: hidden; white-space: nowrap; padding: 0 6px; text-align: left; }
.pmk { position: absolute; top: 12px; width: 13px; height: 13px; transform: rotate(45deg); border: 2px solid var(--card); padding: 0; cursor: pointer; z-index: 1; }
.pmk.static { position: static; display: inline-block; cursor: default; }
.pmk.s-overdue { background: var(--bad); }
.pmk.s-today { background: var(--mid); }
.pmk.s-soon { background: #d9a53a; }
.pmk.s-planned { background: var(--muted); }
.pname { position: absolute; top: 10px; height: 20px; max-width: 190px; border: 0; background: none; padding: 0 2px; font: 700 0.78rem/20px var(--head); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; cursor: pointer; }
.pname.flip { text-align: right; color: var(--muted); }
.pname:hover { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }
.ptoday { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--gold); pointer-events: none; z-index: 2; }
.ptoday-key { display: inline-block; width: 2px; height: 12px; background: var(--gold); }

/* scheda laterale del gruppo e dell'import */
.panel-host .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(540px, 100%); background: var(--bg); z-index: 21; display: flex; flex-direction: column; border-left: 1px solid var(--line); box-shadow: -16px 0 32px rgba(22, 35, 42, 0.14); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--card); }
.sheet-head h2 { font-size: 1.35rem; }
.sheet-sub { margin: 2px 0 0; font: 600 0.72rem var(--head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-ink); }
.sheet-body { flex: 1; overflow-y: auto; padding: 10px 14px 18px; }
.sheet-foot { display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--card); }
.facts { display: grid; grid-template-columns: 112px 1fr; gap: 2px 10px; margin: 0 0 8px; padding: 8px 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); font-size: 0.84rem; }
.facts dt { font: 600 0.66rem/1.9 var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; }
.organizer, .controls { display: grid; gap: 6px; margin: 0 0 8px; padding: 8px 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.organizer { border-left: 4px solid var(--blue); }
.organizer h3, .sub-title, .tpl-preview h3 { font-size: 1rem; }
.sub-title { margin: 12px 0 6px; }
.org-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.org-grid label { display: grid; gap: 2px; font: 600 0.64rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.org-grid input { width: 100%; min-height: 32px; padding: 4px 8px; color: var(--text); font: 400 0.86rem var(--body); letter-spacing: 0; text-transform: none; }
.org-grid input.edited { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--gold); }
.lang { display: flex; align-items: center; gap: 8px; font-size: 0.84rem; color: var(--muted); }
.pay { display: grid; gap: 4px; margin: 6px 0 2px; }
.pay-label { font-size: 0.8rem; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.step { display: grid; grid-template-columns: 24px 1fr; gap: 8px; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--r); }
.step.s-overdue { border-left-color: var(--bad); }
.step.s-today, .step.s-soon { border-left-color: var(--mid); }
.step.s-done { border-left-color: var(--ok); }
.step.focus { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
.step-n { font: 700 1.15rem/1.1 var(--head); color: var(--gold-ink); font-variant-numeric: tabular-nums; }
.step h3 { display: inline; font-size: 1rem; }
.step-when { margin: 1px 0 4px; font: 700 0.72rem var(--head); letter-spacing: 0.08em; text-transform: uppercase; }
.step.s-overdue .step-when { color: var(--bad); }
.step.s-today .step-when, .step.s-soon .step-when { color: var(--mid); }
.step.s-done .step-when { color: var(--ok); }
.step.s-na .step-when, .step.s-waiting .step-when, .step.s-lapsed .step-when, .step.s-planned .step-when { color: var(--muted); }
.step-info { margin: 2px 0; color: var(--muted); font-size: 0.8rem; }
.step-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.step-actions .btn { min-height: 30px; padding: 3px 10px; font-size: 0.88rem; }
.notes { display: grid; gap: 3px; margin: 10px 0; }
.notes > span { font: 600 0.64rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.table-wrap.small table { min-width: 520px; font-size: 0.78rem; }
.bookings th { font: 600 0.64rem var(--head); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.bookings th, .bookings td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
.bookings tr:last-child td { border-bottom: 0; }
.bookings tr.cancelled td { color: var(--muted); text-decoration: line-through; }
.mono-id { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* import */
.file { margin: 0 0 8px; }
.field { border: 0; padding: 0; margin: 0 0 8px; }
.field legend { margin-bottom: 4px; font: 600 0.68rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.summary { margin: 8px 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin-bottom: 8px; }
.kpi { display: grid; gap: 0; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 10px; }
.kpi-n { font: 700 1.5rem/1 var(--head); color: var(--ink); font-variant-numeric: tabular-nums; }
.kpi-l { font: 600 0.66rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.new-list, .near-list { margin: 0 0 6px; padding-left: 16px; font-size: 0.84rem; }
.near-list { list-style: none; padding-left: 0; }
.new-list li, .near-list li { margin: 3px 0; }
.mapping { margin-top: 10px; padding: 6px 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.mapping summary { cursor: pointer; min-height: 30px; font: 700 0.95rem/30px var(--head); color: var(--ink); }
.mapping table th { padding: 3px 8px 3px 0; font-weight: 400; color: var(--muted); font-size: 0.82rem; }
.mapping select { width: 100%; min-height: 32px; padding: 3px 10px; }
.sheet-body .banner { margin: 6px 0; }

/* pagine */
.page { margin-top: 4px; }
.page > .crumb { margin: 12px 0 0; }
.page > h2, .settings h2 { font-size: 1.35rem; margin: 12px 0 8px; }
.page > .crumb + h2 { margin-top: 2px; }
.lead-text { color: var(--muted); max-width: 780px; margin: 0 0 8px; }
.reg-add { display: grid; grid-template-columns: 1fr 1fr 1.4fr auto; gap: 6px; margin: 10px 0; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: var(--r); }
.regulars th { font: 600 0.66rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.regulars th, .regulars td { padding: 3px 6px; border-bottom: 1px solid var(--line); }
.regulars tr:last-child td { border-bottom: 0; }
.regulars input { width: 100%; min-height: 32px; padding: 4px 8px; }
.texts { display: grid; grid-template-columns: 230px minmax(0, 1fr) minmax(0, 0.9fr); gap: 14px; align-items: start; }
.tpl-nav { display: grid; gap: 6px; }
.tpl-item { text-align: left; border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; background: var(--card); padding: 7px 10px; cursor: pointer; display: grid; gap: 3px; justify-items: start; font: 700 0.95rem/1.2 var(--head); color: var(--ink); }
.tpl-item.on { border-left-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); }
.tpl-edit { display: grid; gap: 8px; }
.field-col { display: grid; gap: 3px; }
.field-col > span { font: 600 0.66rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip-btn { border: 1px solid var(--line); border-radius: 999px; background: var(--card); padding: 2px 8px; font: 400 0.72rem var(--body); cursor: pointer; }
.chip-btn:hover { border-color: var(--gold); color: var(--gold-ink); }
.preview { white-space: pre-wrap; margin: 6px 0 0; padding: 12px; max-height: 70vh; overflow: auto; font: 0.84rem/1.55 var(--body); background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.settings section { display: grid; gap: 8px; max-width: 880px; margin: 0 0 10px; padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: var(--r); }
.settings section h2 { font-size: 1.15rem; margin: 0 0 2px; }
.settings h3 { font-size: 0.98rem; }
.field-group { display: grid; gap: 4px; }
.field-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.88rem; }
.field-label { min-width: 230px; }
.field-row input[type="number"] { width: 84px; min-height: 32px; }
.suffix { color: var(--muted); font-size: 0.84rem; }

/* guida */
.guide-grid { display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-flow: dense; gap: 10px; margin-top: 10px; }
@media (min-width: 760px) { .guide-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1200px) { .guide-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.guide-card { padding: 12px 14px; display: grid; gap: 6px; align-content: start; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--r); font-size: 0.88rem; }
.guide-card.wide { grid-column: 1 / -1; }
.guide-icon { font-size: 1.4rem; line-height: 1; }
.guide-card h3 { font-size: 1.15rem; }
.guide-card p { margin: 0; }
.guide-list { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.guide-list.swatches { list-style: none; padding-left: 0; }
.guide-steps { list-style: none; margin: 2px 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 8px 16px; }
.guide-steps li { display: grid; grid-template-columns: 28px 1fr; gap: 6px; align-items: start; }
.gs-n { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--gold-soft); color: var(--gold-ink); font: 700 0.95rem var(--head); }
.gs-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
.gs-head strong { font: 700 1rem var(--head); color: var(--ink); }
.gs-when { font: 600 0.68rem var(--head); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-ink); }
.guide-steps p { margin: 1px 0 0; color: var(--muted); font-size: 0.84rem; }
.sw { display: inline-block; min-width: 80px; padding: 1px 8px; border-radius: 8px; font: 700 0.86rem var(--head); text-align: center; }
.sw.s-overdue { background: var(--bad-bg); color: var(--bad); }
.sw.s-today { background: var(--mid-bg); color: var(--mid); }
.sw.s-done { background: var(--ok-bg); color: var(--ok); }
.sw.s-waiting { background: var(--grey-bg); color: var(--muted); }
.k-gold { border-left-color: var(--gold) !important; }
.k-green { border-left-color: var(--accent) !important; }
.k-blue { border-left-color: var(--blue) !important; }
.k-dark { border-left-color: var(--dark) !important; }

/* accesso (versione GitHub Pages + Firebase) */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.login-card { width: min(400px, 100%); display: grid; gap: 10px; padding: 22px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: var(--r); }
.login-card .eyebrow-row { display: flex; align-items: center; gap: 10px; }
.login-card h1 { font-size: 1.8rem; }
.login-card .muted { margin: 0; }
.login-form { display: grid; gap: 10px; margin-top: 4px; }
.login-form label { display: grid; gap: 3px; font: 600 0.68rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.login-form input { width: 100%; font: 400 0.95rem var(--body); letter-spacing: 0; text-transform: none; color: var(--text); }
.login-msg { min-height: 1.4em; margin: 0; color: var(--bad); font-size: 0.86rem; }
.login-msg.ok { color: var(--accent-ink); }

/* notifiche e trascinamento */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: grid; gap: 6px; width: min(520px, calc(100% - 20px)); }
.toast { display: grid; gap: 6px; padding: 9px 12px; border-radius: 12px; background: var(--dark); color: var(--bg); font-size: 0.88rem; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); }
.toast p { margin: 0; }
.toast.error { background: var(--bad); color: #fff; }
.toast .btn { min-height: 30px; padding: 3px 12px; border-color: currentColor; background: transparent; color: inherit; font-size: 0.88rem; }
.toast-actions { display: flex; gap: 6px; justify-content: flex-end; }
.copybox { background: var(--card); color: var(--text); }
.drop { position: fixed; inset: 10px; z-index: 50; display: none; align-items: center; justify-content: center; border: 3px dashed var(--gold); border-radius: var(--r); background: color-mix(in srgb, var(--bg) 88%, transparent); font: 700 1.5rem var(--head); color: var(--gold-ink); pointer-events: none; }
.drop.on { display: flex; }

/* scheda: sintesi in alto e dettagli richiudibili */
.sheet-summary { margin: 0 0 4px; font-size: 0.86rem; color: var(--text); }
.sheet-body > .badges { margin: 0 0 6px; }
.sheet-body > .lang { margin: 0 0 8px; }
.more { margin-top: 6px; padding: 6px 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.more summary { cursor: pointer; min-height: 30px; font: 700 0.95rem/30px var(--head); color: var(--ink); }
.more .facts { border: 0; padding: 4px 0; margin: 0; }
.more .table-wrap { margin: 4px 0; }

/* passi già fatti o non previsti: una riga sola, così risaltano quelli da fare */
.step.s-done .step-main, .step.s-na .step-main { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.step.s-done .step-when, .step.s-na .step-when { margin: 0; }
.step.s-done .step-actions, .step.s-na .step-actions { margin: 0 0 0 auto; }
.step.s-done .step-info, .step.s-na .step-info, .step .pay { flex-basis: 100%; }
.step.s-done, .step.s-na { padding-top: 6px; padding-bottom: 6px; }

/* schermi piccoli */
@media (max-width: 1100px) { .texts { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .topbar { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; padding: calc(6px + env(safe-area-inset-top, 0px)) 10px 6px; }
  .topnav { display: contents; }
  .brand { grid-column: 1; grid-row: 1; }
  .top-actions { grid-column: 2; grid-row: 1; justify-content: flex-end; }
  .tabs { grid-column: 1 / -1; grid-row: 2; }
  .status, .main { padding-left: 10px; padding-right: 10px; }
  .todo-item { grid-template-columns: minmax(0, 1fr); }
  .todo-actions { justify-content: flex-start; }
  .btn, .btn.small { min-height: 38px; }
  .reg-add { grid-template-columns: 1fr; }
  .org-grid { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .export { display: none; }
  .account-name { display: none; }
}
@media (max-width: 380px) { .brand-name { display: none; } }

/* rooming list e modulo cena dentro il passo */
.rooming-box { flex-basis: 100%; display: grid; gap: 3px; margin: 6px 0 2px; }
.rooming-box > span, .dinner-form label { font: 600 0.64rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.rooming-box textarea { font: 400 0.84rem/1.5 var(--body); }
.dinner-form { flex-basis: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; margin: 6px 0 2px; }
.dinner-form label { display: grid; gap: 2px; }
.dinner-form .full, .dinner-form .row.full, .dinner-form .hint.full, .dinner-form .dinner-total { grid-column: 1 / -1; }
.dinner-form input, .dinner-form textarea { min-height: 32px; padding: 4px 8px; font: 400 0.86rem var(--body); letter-spacing: 0; text-transform: none; color: var(--text); }
.dinner-total { margin: 0; font: 700 0.95rem var(--head); color: var(--ink); letter-spacing: 0; text-transform: none; }
.dinner-form .hint { letter-spacing: 0; text-transform: none; font: 400 0.8rem var(--body); }

/* report cena: foglio bianco anche in modalità scura, pronto per la stampa */
.print-sheet { position: fixed; top: 20px; bottom: 20px; left: 50%; transform: translateX(-50%); width: min(720px, calc(100% - 24px)); overflow-y: auto; background: #ffffff; color: #16232a; border-radius: 12px; padding: 18px 24px 22px; z-index: 22; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); }
.print-sheet .crumb { color: #8a6a2c; margin: 8px 0 0; }
.print-sheet h1 { font: 700 1.7rem/1.1 var(--head); color: #16232a; margin: 2px 0 10px; }
.print-sheet h2 { font: 700 1.05rem var(--head); color: #16232a; margin: 14px 0 4px; }
.print-sheet .pr-facts { display: grid; grid-template-columns: 110px 1fr; gap: 2px 12px; margin: 0; padding: 10px 12px; border: 1px solid #e5e0d6; border-left: 4px solid #b0883c; border-radius: 10px; font-size: 0.9rem; }
.print-sheet .pr-facts dt { font: 600 0.66rem/1.9 var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: #6b7b83; }
.print-sheet .pr-facts dd { margin: 0; }
.print-sheet pre { margin: 0; padding: 8px 12px; border: 1px solid #e5e0d6; border-radius: 10px; white-space: pre-wrap; font: 0.92rem/1.5 var(--body); }
.print-sheet .pr-allergy { border: 2px solid #b23a2e; background: #fdf1ef; font-weight: 600; }
.print-sheet .pr-foot { margin: 14px 0 0; color: #6b7b83; font-size: 0.8rem; }
.print-sheet .btn { color: #16232a; background: #fff; border-color: #e5e0d6; }
.print-sheet .btn.primary { background: #2e7d5b; border-color: #2e7d5b; color: #fff; }
.print-sheet .btn.ghost { border-color: transparent; color: #6b7b83; }
@media print {
  body.printing .topbar, body.printing .status, body.printing .main, body.printing .toasts, body.printing .drop, body.printing .panel-host .scrim, body.printing .no-print { display: none !important; }
  body.printing { background: #fff; }
  body.printing .print-sheet { position: static; transform: none; width: auto; box-shadow: none; border-radius: 0; padding: 0; overflow: visible; }
}

.menu-picks { display: grid; gap: 6px; }
.mp-label { font: 600 0.64rem var(--head); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.menu-row { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; align-items: start; }
.menu-row input { min-height: 32px; padding: 4px 8px; text-align: center; font-variant-numeric: tabular-nums; }
.menu-info { display: grid; font-size: 0.84rem; }
.menu-info b { font: 700 0.92rem var(--head); color: var(--ink); }
.menu-info span { color: var(--muted); font-size: 0.78rem; }
.warn-hint { color: var(--mid); font-weight: 600; }
.menus .menu-price input { width: 84px; }
.menus textarea { font: 400 0.82rem/1.4 var(--body); }

/* una scheda per ogni sera di cena */
.night { display: grid; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 10px; background: var(--soft); }
.night-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.night-head h4 { margin: 0; font: 700 0.98rem var(--head); color: var(--ink); letter-spacing: 0; text-transform: none; }
.night-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 8px; }
.night-grid label, .night-var { display: grid; gap: 2px; font: 600 0.62rem var(--head); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.night .menu-picks { gap: 4px; }
.night .menu-row input, .night-grid input, .night-var input { background: var(--card); }
.night-sub { margin: 0; font: 700 0.88rem var(--head); color: var(--ink); letter-spacing: 0; text-transform: none; }
@media (max-width: 700px) { .night-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* report: blocco per sera */
.print-sheet .pr-night { margin-top: 4px; }
.print-sheet .pr-line { margin: 0 0 4px; color: #3c4a52; font-size: 0.9rem; }
</style>

siamo lieti di accogliervi presso la nostra struttura per il vostro soggiorno {{stagione}}.

Desideriamo ricordarvi che, come specificato sul nostro sito web ufficiale e sui canali di prenotazione, le prenotazioni di gruppo (definite come un numero pari o superiore a {{soglia_camere}} camere, o prenotazioni multiple effettuate a nome del medesimo prenotante) prevedono condizioni specifiche volte a garantire la massima qualità del servizio per tutti i nostri ospiti.

Per poter confermare e bloccare in via definitiva le camere prenotate, verrà richiesto 2 mesi prima della data d’arrivo, il versamento di una caparra pari al 30% del valore totale del soggiorno. Sarà nostra cura scrivervi in quel periodo per fornirvi tutti i dettagli necessari. Questa caparra funge da garanzia reciproca: permette a voi di avere la certezza della disponibilità e alla nostra struttura di riservare le risorse necessarie con la dovuta accuratezza.

Nota bene: il versamento è inteso come caparra confirmatoria non rimborsabile, a tutela del blocco delle camere e della pianificazione operativa.

Per organizzarci al meglio, vi chiediamo di indicarci fin d’ora con quale mezzo preferite versare la caparra: bonifico bancario, link di pagamento (Zahlknopf) o addebito sulla carta di credito indicata nella prenotazione.

Ecco come funzionerà il resto:

- Flessibilità: fino a 5 giorni prima del vostro arrivo, potrete richiedere modifiche alla prenotazione. Se ci sarà disponibilità, aggiorneremo la prenotazione adattando il prezzo alle nuove esigenze.

- Cancellazione: sempre entro il limite dei 5 giorni dall’arrivo, è possibile cancellare la prenotazione senza ulteriori penali (oltre alla caparra versata).

- Il saldo: il pagamento della parte restante verrà richiesto 5 giorni prima del vostro arrivo, come da prassi per le nostre prenotazioni.

Restiamo a vostra completa disposizione per qualsiasi chiarimento o necessità. Non vediamo l'ora di darvi il benvenuto.

Un cordiale saluto,

Il team degli Alpstay Hotels`,wp=`Dear Guests,

We are delighted to welcome you to our hotel for your upcoming {{stagione}} stay.

We would like to remind you that, as specified on our official website and booking channels, group bookings (defined as {{soglia_camere}} or more rooms, or multiple bookings made under the same name) are subject to specific conditions to ensure the highest quality of service for all our guests.

To confirm and definitively secure the booked rooms, a deposit of 30% of the total stay value will be required 2 months prior to your arrival date. We will contact you at that time to provide you with all the necessary payment details. This deposit serves as a mutual guarantee: it ensures your room availability and allows our staff to carefully manage the necessary resources. Please note: This deposit is non-refundable, as it secures the reservation of the rooms and assists in our operational planning.

So that we can organise everything in advance, please let us know now how you would prefer to pay the deposit: bank transfer, payment link or charge to the credit card provided with your booking.

Here is how the rest of the process works:

- Flexibility: You may request changes to your booking up to 5 days before your arrival. Subject to availability, we will be happy to update your booking and adjust the price to your new requirements.

- Cancellation: You may cancel your reservation up to 5 days before your arrival without any further penalty (beyond the deposit paid).

- Balance: The remaining balance will be requested 5 days before your arrival, in accordance with our standard booking conditions.

We remain at your complete disposal for any questions or needs. We look forward to welcoming you.

Kind regards,

The Alpstay Hotels Team`,Sp=`Sehr geehrte Gäste,

wir freuen uns sehr, Sie diesen {{stagione}} in unserem Haus begrüßen zu dürfen.

Wir möchten Sie daran erinnern, dass für Gruppenbuchungen (definiert als {{soglia_camere}} oder mehr Zimmer oder mehrere Buchungen, die auf denselben Namen getätigt wurden), wie auf unserer offiziellen Website und in den Buchungsportalen angegeben, besondere Bedingungen gelten. Diese dienen dazu, die höchste Servicequalität für alle unsere Gäste zu gewährleisten.

Um die gebuchten Zimmer endgültig zu bestätigen und für Sie zu sichern, wird 2 Monate vor Anreise eine Anzahlung in Höhe von 30 % des Gesamtaufenthaltswertes fällig. Wir werden uns zu diesem Zeitpunkt bei Ihnen melden, um Ihnen alle erforderlichen Details zur Zahlung mitzuteilen. Diese Anzahlung dient als gegenseitige Sicherheit: Sie garantiert Ihnen die Verfügbarkeit der Zimmer und ermöglicht es unserem Team, die notwendigen Ressourcen sorgfältig zu planen. Bitte beachten Sie: Diese Anzahlung ist nicht erstattungsfähig, da sie der verbindlichen Zimmerreservierung und der betrieblichen Planung dient.

Damit wir alles bestmöglich vorbereiten können, bitten wir Sie, uns bereits jetzt mitzuteilen, wie Sie die Anzahlung leisten möchten: per Banküberweisung, über einen Zahlungslink (Zahlknopf) oder durch Belastung der bei der Buchung angegebenen Kreditkarte.

So funktioniert der weitere Ablauf:

- Flexibilität: Bis 5 Tage vor Anreise können Sie Änderungen an Ihrer Buchung vornehmen. Sofern verfügbar, werden wir Ihre Buchung gerne aktualisieren und den Preis an Ihre neuen Anforderungen anpassen.

- Stornierung: Bis zu 5 Tage vor Anreise können Sie Ihre Buchung ohne weitere Gebühren stornieren (abgesehen von der bereits geleisteten Anzahlung).

- Restzahlung: Die Restzahlung des Gesamtbetrages wird 5 Tage vor Anreise fällig, gemäß unseren üblichen Buchungsbedingungen.

Für Rückfragen oder weitere Informationen stehen wir Ihnen jederzeit gerne zur Verfügung. Wir freuen uns darauf, Sie bald bei uns willkommen zu heißen.

Mit freundlichen Grüßen,

Ihr Alpstay Hotels Team`,Ep=`Buongiorno,

siamo lieti di vedervi tra pochi mesi!

Come comunicato, essendo il vostro arrivo previsto a 2 mesi da domani, la struttura procederà con la richiesta di pagamento della caparra richiesta.

Se si desidera procedere con il pagamento della caparra del 30% tramite bonifico o link di pagamento, vi chiederemmo di comunicarcelo entro le prossime 24h rispondendo a questo messaggio.

Senza una comunicazione particolare verrà effettuata in automatico una detrazione pari al 30% del soggiorno totale dalla carta di credito fornita.

Non dovesse essere possibile la detrazione le camere prenotate non saranno garantite e saranno rimesse in vendita fino a pagamento effettuato della caparra.

Un cordiale saluto,

Il team degli Alpstay Hotels`,Cp=`Good morning,

we look forward to seeing you in a few months!

As previously communicated, since your arrival is scheduled for two months from tomorrow, the property will proceed with the request for payment of the required deposit.

If you wish to pay the 30% deposit by bank transfer or payment link, please let us know within the next 24 hours by replying to this message.

Without specific notification, a deduction equal to 30% of the total stay will be automatically made from the credit card provided.

If the deduction is not possible, the rooms booked will not be guaranteed and will be put back on sale until the deposit is paid.

Kind regards,

The team of Alpstay Hotels`,kp=`Guten Tag,

wir freuen uns, Sie in wenigen Monaten begrüßen zu dürfen!

Wie bereits mitgeteilt, wird die Unterkunft, da Ihre Ankunft in zwei Monaten ab Morgen vorgesehen ist, die Zahlung der erforderlichen Anzahlung beantragen.

Wenn Sie die Anzahlung in Höhe von 30 % per Überweisung oder Zahlungslink leisten möchten, bitten wir Sie, uns dies innerhalb der nächsten 24 Stunden durch Beantwortung dieser Nachricht mitzuteilen.

Ohne besondere Mitteilung wird automatisch ein Betrag in Höhe von 30 % des Gesamtpreises für den Aufenthalt von der angegebenen Kreditkarte abgebucht.
